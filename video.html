<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SnowLine – Le film</title>
<meta name="robots" content="noindex">
<meta name="description" content="Le film de SnowLine : l'app filmée en vrai, du replay 3D à l'alerte de chute.">
<meta name="theme-color" content="#040a14">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
:root{--ink:#040a14;--navy:#071528;--deep:#0b2540;--txt:#eef4fb;--mut:#93a8c4;--line:rgba(150,195,255,.16);--cyan:#4cc9ff;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;--pad:clamp(20px,5vw,72px)}
*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{min-height:100svh;color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 620px at 50% 38%,#0d3a63 0%,rgba(13,58,99,0) 64%),linear-gradient(180deg,var(--navy),var(--ink));display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) var(--pad) 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.lockup{position:relative;display:inline-block;font-weight:700;letter-spacing:-.02em;font-size:21px;line-height:1.1;padding-top:.05em}
.lockup svg{position:absolute;width:1.32em;height:.45em;left:calc(56.5% - .845em);top:-.30em;overflow:visible;filter:drop-shadow(0 0 .12em rgba(140,217,255,.6))}
.back{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);transition:color .25s}
.back:hover{color:var(--txt)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3vh,28px);padding:8px var(--pad) calc(28px + env(safe-area-inset-bottom));text-align:center}
.cap{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3vw,42px);line-height:1.05;letter-spacing:-.03em;max-width:18ch}
h1 em{font-style:italic}
.vid{position:relative;height:min(60svh,820px);aspect-ratio:9/16;max-width:92vw;border-radius:clamp(14px,2.2vw,26px);overflow:hidden;background:#050d1a;
  box-shadow:0 60px 120px -40px rgba(0,0,0,.9),0 0 120px -30px rgba(45,140,255,.4),0 0 0 1px rgba(150,195,255,.14)}
.vid video{display:block;width:100%;height:100%;object-fit:cover}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 18px;border-radius:999px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:#fff;color:#050d17}
.btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#050d17;padding:11px 20px;border-radius:999px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
.dl{font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .25s}
.dl:hover{color:var(--txt)}
@media (max-aspect-ratio:1/1){.vid{height:auto;width:min(92vw,520px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="mkG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<g id="mkP"><path d="M0 34 L24 13.6 L38 21.1 L64 0 L100 34" fill="url(#mkG)"/><path d="M0 34 L24 13.6 L38 21.1 L64 0 L100 34" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></defs></svg>
<header>
  <a class="brand" href="./" aria-label="SnowLine"><img src="assets/icon.png" alt=""><span class="lockup">SnowLine<svg viewBox="0 0 100 34" aria-hidden="true"><use href="#mkP"/></svg></span></a>
  <a class="back" href="./" id="back">Retour au site</a>
</header>
<main>
  <span class="cap" id="cap">Le film</span>
  <h1 id="h1">Ta journée de ski, <em>comme tu ne l'as jamais vue.</em></h1>
  <div class="vid"><video id="v" controls playsinline preload="metadata" poster="assets/video/poster-fr.jpg" src="assets/video/snowline-fr.mp4"></video></div>
  <div class="row">
    <div class="seg" role="group" aria-label="Langue"><button type="button" data-l="fr" aria-pressed="true">Français</button><button type="button" data-l="en" aria-pressed="false">English</button></div>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6756065022">Télécharger sur l'App Store</a>
    <a class="dl" id="dl" href="assets/video/snowline-fr.mp4" download>Télécharger la vidéo</a>
  </div>
</main>
<script>
const T={fr:{cap:"Le film",h1:"Ta journée de ski, <em>comme tu ne l'as jamais vue.</em>",back:"Retour au site",store:"Télécharger sur l'App Store",dl:"Télécharger la vidéo"},
         en:{cap:"The film",h1:"Your ski day, <em>like you've never seen it.</em>",back:"Back to the site",store:"Download on the App Store",dl:"Download the video"}};
const $=id=>document.getElementById(id), v=$("v");
function setLang(l,keep){const t=T[l];document.documentElement.lang=l;$("cap").textContent=t.cap;$("h1").innerHTML=t.h1;$("back").textContent=t.back;$("store").textContent=t.store;$("dl").textContent=t.dl;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  const src="assets/video/snowline-"+l+".mp4",was=!v.paused,tm=keep?v.currentTime:0;
  if(!v.currentSrc.endsWith(src)){v.poster="assets/video/poster-"+l+".jpg";v.src=src;$("dl").href=src;if(keep){v.addEventListener("loadedmetadata",()=>{v.currentTime=tm;if(was)v.play().catch(()=>{})},{once:true})}}
  try{localStorage.setItem("snowline-lang",l)}catch(e){}}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l,true)));
let saved=null;try{saved=localStorage.getItem("snowline-lang")}catch(e){}
setLang(saved||((navigator.language||"fr").toLowerCase().startsWith("fr")?"fr":"en"),false);
</script>
</body>
</html>
